<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <script>
            function getData() {
              var firstName = document.getElementById("fname").value;
              var lastName = document.getElementById("lname").value;
              var email = document.getElementById("email").value;
              var message = document.getElementById("message").value;
              var agree = document.getElementById("agree");

              document.getElementById("fname").required = true;
              document.getElementById("lname").required = true;
              document.getElementById("email").required = true;
              document.getElementById("message").required = true;
              document.getElementById("agree").required = true;

              document.getElementById("fname").style.backgroundColor = "white";
              document.getElementById("lname").style.backgroundColor = "white";
              document.getElementById("email").style.backgroundColor = "white";
              document.getElementById("message").style.backgroundColor = "white";
              document.getElementById("agree").style.backgroundColor = "white";

              document.getElementById("fname").oninput = function() { this.style.backgroundColor = "white"; };
              document.getElementById("lname").oninput = function() { this.style.backgroundColor = "white"; };
              document.getElementById("email").oninput = function() { this.style.backgroundColor = "white"; };
              document.getElementById("message").oninput = function() { this.style.backgroundColor = "white"; };
              document.getElementById("agree").onchange = function() { this.style.outline = "none"; };


              if (firstName == "") {
                document.getElementById("fname").style.backgroundColor = "red";
                document.getElementById("fname").focus();
              }
              if (lastName == "") {
                document.getElementById("lname").style.backgroundColor = "red";
                document.getElementById("lname").focus();
              }
              if (email == "") {
                document.getElementById("email").style.backgroundColor = "red";
                document.getElementById("email").focus();
              }
              if (message == "") {
                document.getElementById("message").style.backgroundColor = "red";
                document.getElementById("message").focus();
              }
              if (!agree.checked) {
                agree.style.outline = "2px solid red";
                document.getElementById("agree").focus();
                alert("Please agree to the terms of agreement!")
                return false;
              }

              document.getElementById("finalResult").innerHTML= "Name: " + firstName + " " + lastName + "<br>" + " Email: " + email + "<br>" + " Message: " + message;
            }

            function requiredField() {
              if (firstName == "") {
                alert("Required Field!");
                return false;
              }
            }
        </script>
</head>
<body>
  <header id="page-header">
      <strong>Sierra Merrick</strong>
      <nav id="main-nav">
          <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="creative.html">Creative Work</a></li>
              <li><a href="contact.html">Contact</a></li>
              <li><a href="./questiongame.html">The Game</a></li>
          </ul>
      </nav>
  </header>
  <main id="main-content">
    <section id="form-section">

      <table id="contact-form">
        <h2>Contact Me</h2>
        <br>
        <tr>
            <td>First Name:</td>
            <td><input type ="text" id="fname"></td>
        </tr>
        <tr>
            <td>Last Name:</td>
            <td><input type ="text" id="lname"></td>
        </tr>
        <tr>
            <td>Email:</td>
            <td><input type="text" id="email" placeholder="name@example.com"></td>
        </tr>
        <tr>
            <td>Message:</td>
            <td><textarea type ="text" id="message" rows="5"></textarea></td>
        </tr>
        <tr>
          <td><input type="radio" id="agree"></td>
          <td>Accept the terms of agreement</td>
        </tr>
        <tr>
            <td colspan="2"><button id="btnSubmit" onClick="getData();">Submit</button></td>
        </tr>
      </table>
      <div id="finalResult"></div>
    </section>
  </main>
</body>
</html>
