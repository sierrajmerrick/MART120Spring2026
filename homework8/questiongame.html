<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <script>
            var actualAnswer;
            let correct = 0;
            let incorrect = 0;

            function printQuestion() {
                var number1 = Math.floor(Math.random() * 10);
                var number2 = Math.floor(Math.random() * 10);

                actualAnswer = number1 + number2;

                document.getElementById("theQuestion").innerHTML = "What is " + number1 + "+" + number2 + "?";
            }

            function printScoreStats() {
                let totalQuestions = correct + incorrect;
                let percent = 0;

                if (totalQuestions > 0) {
                    percent = (correct/totalQuestions) * 100;
                }

                document.getElementById("stats").innerHTML ="<h3 style='text-decoration: underline'>! Final Results !</h3>" + "<strong>Total Questions: </strong>" + totalQuestions + "<br>" + "<strong>Correct Answers: </strong>" + correct + "<br>" + "<strong>Incorrect Answers: </strong>" + incorrect + "<br>" + "<strong>Percentage of correct answers: </strong>" + percent + "%";
            }

            function checkAnswer() {
                var answer = document.getElementById("txtAnswer").value;
                

                if(answer == actualAnswer) {
                    document.getElementById("finalResult").innerHTML = "Good Job!";
                    correct++
                    printQuestion();
                }
                else {
                    document.getElementById("finalResult").innerHTML = "Not Quite!";
                    incorrect++
                    printQuestion();
                } 

                let totalAnswers = correct + incorrect;

                if (totalAnswers > 9) {
                    printScoreStats();

                }
            }

            function runGame() {
                for (var i = 1; i < 6; i++) {
                    document.getElementById("message").innerHTML += "<h" + i + ">Welcome to our game!!! </h" + i + "></p>";
                }
                printQuestion();
                
            }

        </script>
    </head>
    <body onload="runGame();">
        <header>
            <nav>
                <ul>
                    <a href="./index.html">Home</a>
                    <a href="./form.html">Form</a>
                    <a href="./ifstatements.html">If Statements</a>
                    <a href="./forloops.html">For Loops</a>
                    <a href="./questiongame.html">The Game</a>
                </ul>
            </nav>
        </header>
        
        <table>
            <tr>
                <td colspan="2">
                    <div id="message"></div>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <hr size="1">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <div id="theQuestion"></div>
                </td>
            </tr>
            <tr>
                <td>Your answer</td>
                <td><input type="text" id="txtAnswer"></td>
            </tr>
            <tr>
                <td colspan="2"><button id="btnSubmit" onClick="checkAnswer();">Submit</button></td>
            </tr>
        </table>
        <div id="finalResult"></div>
        <div id="stats"></div>
    </body>
</html>
