<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loops</title>
    <script>
        function theForLoop(){
            var result = "";
            for (var i = 0; i < 5; i ++) {
                result += i + "<br>";
            }
            document.getElementById("theResult").innerHTML = result;
        }
    </script>
</head>
<body onload="theForLoop();">

</body>
</html>
