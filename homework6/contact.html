<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
</head>
<body>
  <header id="page-header">
      <strong>Sierra Merrick</strong>
      <nav id="main-nav">
          <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="creative.html">Creative Work</a></li>
              <li><a href="contact.html">Contact</a></li>
          </ul>
      </nav>
  </header>
  <main id="main-content">
    <section id="form-section">
        <form id="contact-form">
        <h2>Contact Me</h2>
        <br>
        <div>
          <label for="fname">First name:</label>
          <input id="fname" type="text" name="name" required>
        </div>
        <br>
        <div>
          <label for="lname">Last name:</label>
          <input id="lname" type="text" name="name" required>
        </div>
        <br>
        <div>
          <label for="email">Email:</label>
          <input id="email" type="email" name="email" placeholder="name@example.com" required>
        </div>
        <br>
        <div>
          <label for="message">Message:</label>
          <br>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <br>
        <div>
            <input id="agree" type="radio" name="agree" required/>   
            <label for="agree">Accept the terms of agreement</label>         
        </div>
        <br>
        <div>
          <button type="submit">Get in touch</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
